name: Screenshots

# Photographs the README's images on a GitHub macOS runner, with the same
# scripts/capture-shots.sh anyone can run on their own Mac, and uploads them
# as an artifact to be looked at before anything is committed. Run by hand:
# nothing here should change what main publishes on its own.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma separated shot names to retake (empty: all)"
        required: false
        default: ""
      languages:
        description: "Interface languages, comma separated: zh-Hans, en"
        required: false
        default: "zh-Hans,en"

permissions:
  contents: read

concurrency:
  group: shots
  cancel-in-progress: true

jobs:
  shots:
    name: Capture screenshots
    # The same image the main CI builds on: macOS 26 is the deployment target.
    runs-on: macos-26
    # Two languages, each a full pass with its network waits and the minute
    # of system history.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3

      - name: Install XcodeGen
        timeout-minutes: 5
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install --quiet xcodegen

      - name: Generate the project
        timeout-minutes: 2
        run: xcodegen generate

      - name: Display
        timeout-minutes: 2
        run: |
          system_profiler SPDisplaysDataType || true
          sw_vers

      # The runner boots at 1024x768, which crops a whole shelf.
      # displayplacer lists the modes the virtual display offers; a scaled
      # (HiDPI) mode at least 1440 points wide is preferred, then the widest
      # plain one up to 1920. Allowed to fail: the capture
      # still runs at whatever the display is.
      - name: Larger display
        timeout-minutes: 3
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install --quiet displayplacer || exit 0
          displayplacer list | tee "$RUNNER_TEMP/displays.txt" || exit 0
          choice=$(python3 - "$RUNNER_TEMP/displays.txt" <<'PY'
          import re, sys
          text = open(sys.argv[1]).read()
          ident = re.search(r"Persistent screen id: (\S+)", text)
          # "scaling:on" marks a HiDPI mode; the runner's virtual display
          # has offered none so far, so the field is optional.
          modes = re.findall(r"mode (\d+): res:(\d+)x(\d+)([^\n]*)", text)
          if not ident or not modes:
              sys.exit(0)
          def score(m):
              w, h, scaled = int(m[1]), int(m[2]), "scaling:on" in m[3]
              hidpi = scaled and 1440 <= w <= 1920
              # Plain modes are taken up to 1920 wide, which holds the widest
              # shelf with room to spare.
              return (hidpi, w if hidpi else 0, w * h if w <= 1920 else 0)
          best = max(modes, key=score)
          print(f"id:{ident.group(1)} mode:{best[0]}")
          PY
          )
          echo "choosing: $choice"
          [ -n "$choice" ] && displayplacer "$choice" || true
          sleep 3
          system_profiler SPDisplaysDataType | grep -i -E "resolution|retina|ui looks" || true

      # Chinese system language, region and time zone, so dates, times and
      # file sizes the widgets format come out the way a reader of this
      # fork sees them. Read by the Shots process when it launches.
      - name: Chinese locale
        timeout-minutes: 2
        run: |
          defaults write -g AppleLanguages -array zh-Hans
          defaults write -g AppleLocale -string zh_CN
          sudo systemsetup -settimezone Asia/Shanghai >/dev/null 2>&1 || true

      # Screen Recording is granted per client in TCC. A runner is a throwaway
      # machine, so the grant is written straight into both databases for the
      # processes that end up asking: the shell running the script, the
      # screencapture tool and the runner's own agents. Either database may
      # refuse a write (the system one is protected wherever SIP is on), which
      # is why every insert is allowed to fail and the next step checks the
      # result instead of trusting this one.
      - name: Grant Screen Recording
        timeout-minutes: 2
        run: |
          grant() {
            db="$1"; client="$2"; type="$3"
            [ -f "$db" ] || return 0
            $4 sqlite3 "$db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, flags) VALUES ('kTCCServiceScreenCapture', '$client', $type, 2, 4, 1, 0);" \
              && echo "granted $client in $db" || echo "could not write $db for $client"
          }
          user_db="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          system_db="/Library/Application Support/com.apple.TCC/TCC.db"
          clients="/bin/bash /bin/sh /bin/zsh /usr/sbin/screencapture /usr/bin/env"
          for path in $(ls -d /Users/runner/actions-runner/*/bin/Runner.* /opt/runner/*/bin/Runner.* 2>/dev/null); do
            clients="$clients $path"
          done
          for client in $clients; do
            grant "$system_db" "$client" 1 sudo
            grant "$user_db" "$client" 1 ""
          done
          for bundle in com.apple.Terminal com.apple.screencaptureui; do
            grant "$system_db" "$bundle" 0 sudo
            grant "$user_db" "$bundle" 0 ""
          done
          csrutil status || true
          sudo sqlite3 "$system_db" "SELECT client, auth_value FROM access WHERE service='kTCCServiceScreenCapture';" || true

      # A plain, neutral desktop. The Shots tool covers the display with its
      # own backdrop while it captures, but anything that peeks out around it,
      # a notification or the menu bar, should be plain too.
      - name: Quiet desktop
        timeout-minutes: 2
        run: |
          defaults write com.apple.screencapture location "$HOME/Desktop"
          mkdir -p "$HOME/Desktop" "$HOME/Downloads"
          # Automation consent can leave osascript waiting forever, so it gets
          # fifteen seconds and is then abandoned.
          osascript -e 'tell application "System Events" to tell every desktop to set picture to "/System/Library/Desktop Pictures/Solid Colors/Silver.png"' &
          sleep 15
          kill %1 2>/dev/null || true

      - name: Check that a capture is not blank
        timeout-minutes: 2
        run: |
          mkdir -p "$RUNNER_TEMP/check"
          screencapture -x "$RUNNER_TEMP/check/fullscreen.png" || true
          ls -la "$RUNNER_TEMP/check"
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/check/fullscreen.png" || true

      # One pass per language, each into its own folder (zh, en), the same
      # two folders README.md and README.en.md read. The files the first pass
      # wrote into Downloads and the screenshot folder are cleared before the
      # next, or the English panels would list the Chinese file names too.
      # A failed language does not stop the other; the step fails at the end.
      - name: Build screenshot tool
        timeout-minutes: 20
        run: |
          xcodebuild -project Docket.xcodeproj -target Shots -configuration Release \
            SWIFT_OPTIMIZATION_LEVEL=-Onone build \
            > "${TMPDIR:-/tmp}/docket-shots-build.log" 2>&1

      - name: Capture
        timeout-minutes: 12
        env:
          SHOTS_DISPOSABLE: "1"
          SHOTS_SKIP_BUILD: "1"
          SHOTS_FRAME_TIMEOUT: "180"
          SHOTS_ONLY: ${{ inputs.only }}
          SHOTS_LANGUAGES: ${{ inputs.languages }}
        run: |
          if [ -z "$SHOTS_ONLY" ]; then unset SHOTS_ONLY; fi
          failed=""
          for lang in $(printf '%s' "${SHOTS_LANGUAGES:-zh-Hans,en}" | tr ',' ' '); do
            case "$lang" in
              en*) dir=en ;;
              *) dir=zh ;;
            esac
            rm -rf "$HOME/Downloads/"* "$HOME/Desktop/"*.png
            mkdir -p "$RUNNER_TEMP/shots/$dir"
            echo "::group::capture $lang"
            SHOTS_LANG="$lang" SHOTS_OUT="$RUNNER_TEMP/shots/$dir" scripts/capture-shots.sh \
              || failed="$failed $lang"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error title=Capture failed::languages:$failed"
            exit 1
          fi

      - name: Upload screenshots
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/check
          if-no-files-found: warn
          retention-days: 7

      - name: Build log
        timeout-minutes: 2
        if: failure()
        run: |
          for log in "${TMPDIR:-/tmp}"/docket-shots-build.log; do
            [ -f "$log" ] && tail -200 "$log"
          done
          true
