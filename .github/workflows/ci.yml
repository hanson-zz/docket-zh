name: CI

# Pull requests are the gate. Pushes are checked only on main, because a run
# on a branch push and a run on the pull request containing it are the same
# build twice.
#
# workflow_dispatch: run the whole thing by hand on any branch, from the
# Actions tab, whatever CI_MACOS says below.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A second push to a pull request makes the first run's answer worthless.
# Pushes to main are left alone: every commit there is a release candidate.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Deliberately not a dependency of build-and-test. They run side by side so
  # one push tells you about both a typo and a broken build, rather than
  # making you fix the typo to find out about the build.
  house-rules:
    name: House rules
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The scan diffs against the base commit, which a shallow clone
          # does not have.
          fetch-depth: 0

      - name: The generated project is not committed
        run: |
          if [ -n "$(git ls-files Docket.xcodeproj)" ]; then
            echo "::error title=Generated project committed::Docket.xcodeproj is generated by xcodegen from project.yml and is gitignored. Remove it from the commit and change project.yml instead."
            exit 1
          fi

      - name: No em dashes, no tooling credits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA")
          else
            # On main, scan the whole tree. It is clean today and a full pass
            # costs a second, so main stays the reference rather than drifting
            # between whatever each pull request happened to touch.
            files=$(git ls-files)
          fi

          # This file has to spell out the words it is banning, so it is the
          # one file the scan skips.
          files=$(printf '%s\n' "$files" | grep -vx '.github/workflows/ci.yml') || true

          if [ -z "$files" ]; then
            echo "Nothing to check."
            exit 0
          fi

          fail=0

          # -I skips binary files, which is what keeps the icon PNGs and the
          # asset catalog out of it without maintaining an exclude list.
          hits=$(printf '%s\n' "$files" | tr '\n' '\0' | xargs -0 grep -nHI -- '—' 2>/dev/null) || true
          if [ -n "$hits" ]; then
            fail=1
            echo "Em dashes:"
            printf '%s\n' "$hits"
            while IFS= read -r line; do
              file=${line%%:*}
              rest=${line#*:}
              lineno=${rest%%:*}
              echo "::error file=$file,line=$lineno,title=Em dash::Docket does not use em dashes. Use a comma, a colon or a full stop."
            done <<< "$hits"
          fi

          # Narrow on purpose. The word "AI" is legitimate product vocabulary
          # here: README describes an AI usage widget and ROADMAP.md evaluates
          # the Anthropic and OpenAI usage APIs by name. What is banned is a
          # line crediting the tooling a change was made with, so the pattern
          # matches the credit, not the subject.
          credits='(^|[^a-z])(ai|llm)[ -](generated|assisted|written|authored|wrote)|(generated|written|authored|produced|created)[[:space:]]+(by|with|using)[[:space:]]+(ai[^a-z]|an? llm|claude|chatgpt|copilot|gpt-|gemini|cursor)|co-authored-by:[[:space:]]*claude|claude code|vibe[ -]?cod'
          hits=$(printf '%s\n' "$files" | tr '\n' '\0' | xargs -0 grep -nHIEi "$credits" 2>/dev/null) || true
          if [ -n "$hits" ]; then
            fail=1
            echo "Tooling credits:"
            printf '%s\n' "$hits"
            while IFS= read -r line; do
              file=${line%%:*}
              rest=${line#*:}
              lineno=${rest%%:*}
              echo "::error file=$file,line=$lineno,title=Tooling credit::Nothing in this repository names the tooling a change was made with. Remove the line."
            done <<< "$hits"
          fi

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Two house rules, both in CONTRIBUTING.md:"
            echo ""
            echo "  1. No em dashes anywhere. A comma, a colon or a full stop instead."
            echo "  2. Nothing in the repository names the tooling a change was made"
            echo "     with, in code, comments, documentation, workflows, templates or"
            echo "     commit messages."
            echo ""
            echo "Fix the lines listed above and push again."
            exit 1
          fi

          echo "Clean."

      # English strings carry no Chinese characters or Chinese punctuation
      # (a stray "、" once reached the paywall), context keys keep their
      # Chinese values, and placeholders match the key. The few strings that
      # quote Chinese on purpose are allowlisted in the script.
      - name: English strings
        run: python3 scripts/check-en-strings.py

  # Decides whether the macOS job runs. The repository variable CI_MACOS
  # (Settings > Secrets and variables > Actions > Variables) picks the mode:
  #
  #   unset or "always"  every push to main and every pull request, as before.
  #   "code"             only when the change touches something that can break
  #                      the build: Sources, Tests, Resources, Tools, scripts,
  #                      project.yml or this file. Docs and README only changes
  #                      skip it.
  #   "manual"           only when started by hand (workflow_dispatch).
  #
  # Unset is the default and changes nothing. The other two exist because
  # macOS minutes cost ten times Linux minutes once the repository is private;
  # release.yml still does a full Release build of every tag either way.
  scope:
    name: Decide what to build
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.decide.outputs.macos }}

    steps:
      - uses: actions/checkout@v7
        if: vars.CI_MACOS == 'code'
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          MODE: ${{ vars.CI_MACOS }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          mode="${MODE:-always}"
          macos=true
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            macos=true
          elif [ "$mode" = manual ]; then
            macos=false
          elif [ "$mode" = code ]; then
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              range="$BASE_SHA $HEAD_SHA"
            else
              range="$BEFORE $GITHUB_SHA"
            fi
            # A new branch has an all-zero "before" and a force push one that
            # is no longer in the history; git diff fails on both, and then
            # it builds.
            if changed=$(git diff --name-only $range 2>/dev/null); then
              if printf '%s\n' "$changed" | grep -Eq '^(Sources/|Tests/|Resources/|Tools/|scripts/|project\.yml$|\.github/workflows/ci\.yml$)'; then
                macos=true
              else
                macos=false
              fi
            fi
          fi
          echo "CI_MACOS=$mode, event $GITHUB_EVENT_NAME: macOS build and test = $macos"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build and test
    needs: scope
    if: needs.scope.outputs.macos == 'true'
    # macOS 26 is the deployment target, and the SDK has to match.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      # Not cached. The cache round trip would save a bottle download of a few
      # seconds next to an Xcode build of several minutes, and a stale
      # Homebrew cache is its own failure mode. Skipping brew's auto-update is
      # the part of this step that actually costs anything.
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install --quiet xcodegen

      # First, and on its own, because project.yml is the single source of
      # build configuration: if it no longer generates, nothing below it can
      # tell you anything useful.
      - name: Generate the project
        run: xcodegen generate

      # Chinese fork: project.yml already defaults to ad-hoc signing ("-"),
      # no team and the hardened runtime off, so no certificate or secret is
      # needed anywhere. The overrides below are kept so the build stays
      # ad-hoc even if someone points project.yml at their own certificate.
      - name: Build the app
        run: |
          xcodebuild build \
            -project Docket.xcodeproj \
            -scheme Docket \
            -configuration Debug \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            ENABLE_HARDENED_RUNTIME=NO

      # Following the system language falls back to English for anyone whose
      # preferred languages hold neither Chinese nor English. That rests on the
      # built bundle, not on code the tests can reach: English as the
      # development region, and a Traditional Chinese and a Hong Kong table
      # (both carrying the Simplified text) so those users still get Chinese.
      - name: Check the app's localizations
        run: |
          dir=$(xcodebuild -project Docket.xcodeproj -scheme Docket -configuration Debug -showBuildSettings 2>/dev/null \
            | awk -F' = ' '$1 ~ / BUILT_PRODUCTS_DIR$/ { print $2; exit }')
          app="$dir/Dockling.app"
          res="$app/Contents/Resources"
          ls -d "$res"/*.lproj
          region=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDevelopmentRegion' "$app/Contents/Info.plist")
          echo "CFBundleDevelopmentRegion = $region"
          fail=0
          if [ "$region" != en ]; then
            echo "::error title=Development region::CFBundleDevelopmentRegion is $region, expected en."
            fail=1
          fi
          for lang in en zh-Hans zh-Hant zh-HK; do
            for table in InfoPlist Localizable; do
              file="$res/$lang.lproj/$table.strings"
              if [ -f "$file" ]; then
                echo "$lang/$table: $(plutil -convert json -o - "$file" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))') entries"
              else
                echo "::error title=Missing localization::$lang.lproj/$table.strings is not in the app."
                fail=1
              fi
            done
          done
          for lang in zh-Hans zh-Hant zh-HK; do
            name=$(plutil -extract CFBundleDisplayName raw -o - "$res/$lang.lproj/InfoPlist.strings" 2>/dev/null || true)
            echo "$lang display name: $name"
            [ "$name" = "码头" ] || { echo "::error title=Display name::$lang display name is '$name'."; fail=1; }
          done
          name=$(plutil -extract CFBundleDisplayName raw -o - "$res/en.lproj/InfoPlist.strings" 2>/dev/null || true)
          echo "en display name: $name"
          [ "$name" = "Dockling" ] || { echo "::error title=Display name::en display name is '$name'."; fail=1; }
          exit $fail

      # A separate step because DocketTests compiles only the pure core, not
      # the app's own sources - a break in the app would not show up here.
      #
      # Redirected rather than streamed: xcodebuild prints thousands of lines
      # and the one naming the failing test is lost in them. The next step
      # pulls it back out, and the whole log is attached on failure.
      - name: Run the tests
        run: |
          xcodebuild test \
            -project Docket.xcodeproj \
            -scheme DocketTests \
            -configuration Debug \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            ENABLE_HARDENED_RUNTIME=NO \
            > xcodebuild-test.log 2>&1

      - name: Test results
        if: always()
        run: |
          if [ ! -f xcodebuild-test.log ]; then
            echo "The tests did not run: the build above failed."
            exit 0
          fi

          {
            echo "### Tests"
            echo
            if grep -q '^\*\* TEST SUCCEEDED \*\*' xcodebuild-test.log; then
              grep -E 'Executed [0-9]+ test' xcodebuild-test.log | tail -1
            else
              echo '```'
              sed -n '/^Failing tests:/,/^$/p' xcodebuild-test.log || true
              grep -E '^.+:[0-9]+: error:' xcodebuild-test.log \
                | sed "s|$GITHUB_WORKSPACE/||" \
                | head -40 || true
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Full xcodebuild log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-test-log
          path: xcodebuild-test.log
          if-no-files-found: ignore
          retention-days: 7
