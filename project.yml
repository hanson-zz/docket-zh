name: Docket
options:
  # 中文本地化分支：使用独立的 bundle ID 前缀，避免与上游 Docket 冲突。
  bundleIdPrefix: com.docket-zh
  # 开发语言设为简体中文，knownRegions 会包含 zh-Hans。
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.7.0" # x-release-please-version
    CURRENT_PROJECT_VERSION: "5"
    DEAD_CODE_STRIPPING: YES
    # 中文本地化分支：默认使用 ad-hoc 签名（"-"），不需要任何 Apple 开发者证书或团队，
    # 任何人 clone 后都能直接构建。上游使用的个人证书和 DEVELOPMENT_TEAM 已移除。
    # 硬化运行时只有配合真正的 Developer ID 和公证才有意义，因此与上游 CI/发布构建一样关闭。
    #
    # 已知限制（上游原注释）：macOS 不会向 ad-hoc 签名的应用弹出定位授权，
    # 因为没有稳定的签名身份可供绑定授权。天气小组件请在“设置 ▸ 小组件”中手动输入城市。
    # 如需定位授权，可在本地把 CODE_SIGN_IDENTITY 改为你自己的 Apple Development 证书，
    # 并加上 DEVELOPMENT_TEAM。
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
  configs:
    # 发布构建按体积优化：-Osize 和 -O 差不多快（码头的热点在 SwiftUI 和系统框架里，
    # 不在自己的计算循环），机器码小一截；整模块编译让优化器看到全部代码，裁得更干净。
    # 代码全是 Swift，没有 C/ObjC，所以不开 LLVM_LTO（它只管 clang 编的代码）。
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Docket:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/AppIcon.icon
      # 界面文字：Localizable.xcstrings（源语言简体中文，另有英文）和 InfoPlist.xcstrings（权限说明与显示名称）。
      - path: Resources/Localization
      # 赞助小窗用的微信 / 支付宝收款码，作为普通资源打包。
      - path: Resources/Sponsor
        buildPhase: resources
      # 收音机小组件的图标（阿喵收音机 meowRadio 的猫耳复古收音机，MIT），作为普通资源打包。
      - path: Resources/Radio
        buildPhase: resources
      # 喝水小组件的小熊猫（作者自己的应用图标形象，抠图缩小），作为普通资源打包。
      - path: Resources/Water
        buildPhase: resources
      # 菜单栏图标：小熊猫头像剪影（模板图，跟随浅色/深色菜单栏），设计脚本 design/menubar-panda。
      - path: Resources/MenuBar
        buildPhase: resources
      # 电子宠物的状态图（吃饭、饿了、生病，以及小熊猫的全身六种），作为普通资源打包。
      # sprites/ 是桌面宠物和专注陪伴的动作帧（四脚小熊猫的走、跑、叼、跳、坐、趴、探头、拎起、入睡、睡、哈欠、伸懒腰、欢呼、蔫、抬头、吊在上边缘与吊着睡、放下纸团，另有竹竿爬升用的 climb，@2x、256 色 PNG）。
      - path: Resources/Pet
        buildPhase: resources
      # 设置 ▸ 通用 ▸ 应用图标 里可选的运行时图标（小熊猫码头等），作为普通资源打包。
      # 不是 AppIcon：Finder 和启动台仍显示 Resources/AppIcon.icon 的经典图标。
      - path: Resources/AppIcons
        buildPhase: resources
      # 摸鱼时钟的三张小熊猫（上班敲电脑、下班喝茶、周末码头睡觉，透明 PNG 512x512），作为普通资源打包。
      - path: Resources/Slacker
        buildPhase: resources
      # 卜卦的小熊猫：每个动作一张整身 3D 毛绒姿势图（签、卦、书），扣地龟甲、铜钱正反面和
      # 签筒、铜钱皮肤的着色层（@2x、256 色 PNG），作为普通资源打包。
      - path: Resources/Divination
        buildPhase: resources
      # 码头 Pro 解锁庆祝动画：小熊猫三种姿势、皇冠、礼盒、PRO 券（透明 PNG），以及
      # scripts/make-unlock-sounds.py 合成的原创音效（WAV），作为普通资源打包。
      - path: Resources/Unlock
        buildPhase: resources
      # 扫雷的音效（揭开、插旗、踩雷、赢了）：scripts/make-mines-sounds.py 合成的原创 WAV，
      # 作为普通资源打包。
      - path: Resources/Mines
        buildPhase: resources
      # 打字音效的七款单键样本（单声道 32 kHz WAV，合计约 0.43 MB）：青轴、茶轴、打字机是
      # scripts/make-typing-sounds.py 合成的原创音效；红轴、黑轴、静电容裁自 Mechvibes 自带包（MIT），
      # 白噪安静款裁自 OpenGameArt 的 CC0 录音，出处见 NOTICE.md。作为普通资源打包。
      - path: Resources/TypingSounds
        buildPhase: resources
    # Linked explicitly rather than left to auto-linking. The Focus filter in
    # Sources/App/LayoutIntents.swift only appears in System Settings if the
    # build extracts its App Intents metadata, and a framework named here is
    # one less thing for that step to infer.
    dependencies:
      - sdk: AppIntents.framework
      # 充电上限助手：放进 Contents/MacOS，用户在电池面板点“安装助手”时
      # 以管理员身份复制到 /Library/PrivilegedHelperTools 并交给 launchd。
      - target: ChargeHelper
        embed: true
        codeSign: false
        copy:
          destination: executables
      # 系统小组件扩展（桌面右键「编辑小组件」里的「码头」），嵌进 Contents/PlugIns。
      - target: DocklingWidgets
        embed: true
    settings:
      base:
        # 应用改名为“码头 / Dockling”：安装包叫 Dockling.app，Finder 和启动台显示“码头”。
        # 模块名保留 Docket，测试的 @testable import 不用改；bundle ID 不变，设置和权限照常保留。
        PRODUCT_NAME: Dockling
        PRODUCT_MODULE_NAME: Docket
        # 中文本地化分支使用独立的 bundle ID，与上游（com.namanparashar.plinth）
        # 互不干扰：两者的设置文件和系统权限分开保存，可以同时安装。
        PRODUCT_BUNDLE_IDENTIFIER: com.docket-zh.app
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Docket.entitlements
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 检查新版本时查询哪个仓库的 Releases，写进 Info.plist 的 DocklingUpdateRepository。
        # 发布构建由 release.yml 按仓库变量 UPDATE_FEED_REPOSITORY 覆盖，没设时就是这里的值。
        DOCKLING_UPDATE_REPOSITORY: hanson-zz/docket-zh

  # 系统小组件扩展（WidgetKit）。必须沙盒；和主 App 不用 App Group（ad-hoc、自签名都没有
  # Team ID，macOS 15 起组容器不认），而是读写主 App Application Support 下的 SystemWidgets
  # 文件夹（entitlements 里的 temporary-exception），见 Sources/Core/SystemWidgetSnapshot.swift。
  # 只编那一个 Core 文件（外加电池霓虹灯管的两个文件）；小熊猫图片和界面文字表跟主 App 共用同一份资源。
  DocklingWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/DocklingWidgets
      - path: Sources/Core/SystemWidgetSnapshot.swift
      # 电池的霓虹灯管样式：纯逻辑和数字视图都只用 Foundation、SwiftUI、AppKit，和扩展栏卡片共用。
      - path: Sources/Core/BatteryNeon.swift
      - path: Sources/Widgets/Kinds/BatteryNeonDigits.swift
      # 桌面宠物的动作帧只有主 App 用，不打进小组件扩展。
      - path: Resources/Pet
        buildPhase: resources
        excludes:
          - "sprites/**"
      - path: Resources/Water
        buildPhase: resources
      - path: Resources/Localization/Localizable.xcstrings
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
      - sdk: IOKit.framework
    settings:
      base:
        PRODUCT_NAME: DocklingWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.docket-zh.app.widgets
        INFOPLIST_FILE: Resources/DocklingWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/DocklingWidgets/DocklingWidgets.entitlements
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"

  # 充电上限助手（root 运行的命令行小程序），只编译自己和共享的纯逻辑。
  # SMC 和电源的 C 接口用到 mach_task_self_ 这类 C 全局变量，Swift 6 的
  # 严格并发检查会把它当错误，所以这个小目标用 Swift 5 模式。
  ChargeHelper:
    type: tool
    platform: macOS
    sources:
      - path: Tools/ChargeHelper
      - path: Sources/Core/ChargeLimit.swift
    dependencies:
      - sdk: IOKit.framework
    settings:
      base:
        PRODUCT_NAME: dockling-charge-helper
        PRODUCT_BUNDLE_IDENTIFIER: com.docket-zh.chargehelper
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_APP_SANDBOX: NO
        SKIP_INSTALL: YES

  # Renders the real views into PNGs for the README.
  #
  # Its own target rather than a flag on the app, so nothing that exists only
  # to make documentation ships inside the thing people download. It compiles
  # the same sources minus the app's own entry point, which owns @main.
  Shots:
    type: tool
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "App/DocketApp.swift"
          # The Focus filter belongs to the app the system launches, not to a
          # tool that renders screenshots, and only DocketApp.swift uses it.
          - "App/LayoutIntents.swift"
      - path: Tools/Shots
    settings:
      base:
        PRODUCT_NAME: Shots
        PRODUCT_BUNDLE_IDENTIFIER: com.docket-zh.app.shots
        CODE_SIGN_ENTITLEMENTS: Resources/Docket.entitlements
        ENABLE_APP_SANDBOX: NO

  DocketTests:
    type: bundle.unit-test
    platform: macOS
    # Compiles the pure core directly instead of hosting the app: these are
    # maths and catalog invariants, and a test host would only add launch cost.
    sources:
      - path: Tests
      - path: Sources/Core
      - path: Sources/Widgets/WidgetCatalog.swift
      - path: Sources/DockPanel/DockLayout.swift
      - path: Sources/Services/PollGate.swift
      - path: Sources/DockPanel/ScrollRelay.swift
      - path: Sources/DockPanel/MissionControlGesture.swift
      - path: Sources/Services/PagePreview.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.docket-zh.app.tests
        GENERATE_INFOPLIST_FILE: YES
