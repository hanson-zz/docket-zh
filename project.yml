name: Docket
options:
  # 中文本地化分支：使用独立的 bundle ID 前缀，避免与上游 Docket 冲突。
  bundleIdPrefix: com.docket-zh
  # 开发语言设为简体中文，knownRegions 会包含 zh-Hans。
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.6.0" # x-release-please-version
    CURRENT_PROJECT_VERSION: "5"
    DEAD_CODE_STRIPPING: YES
    # 中文本地化分支：默认使用 ad-hoc 签名（"-"），不需要任何 Apple 开发者证书或团队，
    # 任何人 clone 后都能直接构建。上游使用的个人证书和 DEVELOPMENT_TEAM 已移除。
    # 硬化运行时只有配合真正的 Developer ID 和公证才有意义，因此与上游 CI/发布构建一样关闭。
    #
    # 已知限制（上游原注释）：macOS 不会向 ad-hoc 签名的应用弹出定位授权，
    # 因为没有稳定的签名身份可供绑定授权。天气小组件请在“设置 ▸ 小组件”中手动输入城市。
    # 如需定位授权，可在本地把 CODE_SIGN_IDENTITY 改为你自己的 Apple Development 证书，
    # 并加上 DEVELOPMENT_TEAM。
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"

targets:
  Docket:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/AppIcon.icon
      # 中文本地化：zh-Hans.lproj/InfoPlist.strings（权限说明与显示名称）。
      - path: Resources/Localization
      # 赞助小窗用的微信 / 支付宝收款码，作为普通资源打包。
      - path: Resources/Sponsor
        buildPhase: resources
      # 收音机小组件的图标（阿喵收音机 meowRadio 的猫耳复古收音机，MIT），作为普通资源打包。
      - path: Resources/Radio
        buildPhase: resources
      # 喝水小组件的小熊猫（作者自己的应用图标形象，抠图缩小），作为普通资源打包。
      - path: Resources/Water
        buildPhase: resources
      # 电子宠物的状态图（吃饭、饿了、生病，以及小熊猫的全身六种），作为普通资源打包。
      - path: Resources/Pet
        buildPhase: resources
      # 设置 ▸ 通用 ▸ 应用图标 里可选的运行时图标（小熊猫码头等），作为普通资源打包。
      # 不是 AppIcon：Finder 和启动台仍显示 Resources/AppIcon.icon 的经典图标。
      - path: Resources/AppIcons
        buildPhase: resources
    # Linked explicitly rather than left to auto-linking. The Focus filter in
    # Sources/App/LayoutIntents.swift only appears in System Settings if the
    # build extracts its App Intents metadata, and a framework named here is
    # one less thing for that step to infer.
    dependencies:
      - sdk: AppIntents.framework
    settings:
      base:
        # 应用改名为“码头 / Dockling”：安装包叫 Dockling.app，Finder 和启动台显示“码头”。
        # 模块名保留 Docket，测试的 @testable import 不用改；bundle ID 不变，设置和权限照常保留。
        PRODUCT_NAME: Dockling
        PRODUCT_MODULE_NAME: Docket
        # 中文本地化分支使用独立的 bundle ID，与上游（com.namanparashar.plinth）
        # 互不干扰：两者的设置文件和系统权限分开保存，可以同时安装。
        PRODUCT_BUNDLE_IDENTIFIER: com.docket-zh.app
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Docket.entitlements
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Renders the real views into PNGs for the README.
  #
  # Its own target rather than a flag on the app, so nothing that exists only
  # to make documentation ships inside the thing people download. It compiles
  # the same sources minus the app's own entry point, which owns @main.
  Shots:
    type: tool
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "App/DocketApp.swift"
          # The Focus filter belongs to the app the system launches, not to a
          # tool that renders screenshots, and only DocketApp.swift uses it.
          - "App/LayoutIntents.swift"
      - path: Tools/Shots
    settings:
      base:
        PRODUCT_NAME: Shots
        PRODUCT_BUNDLE_IDENTIFIER: com.docket-zh.app.shots
        CODE_SIGN_ENTITLEMENTS: Resources/Docket.entitlements
        ENABLE_APP_SANDBOX: NO

  DocketTests:
    type: bundle.unit-test
    platform: macOS
    # Compiles the pure core directly instead of hosting the app: these are
    # maths and catalog invariants, and a test host would only add launch cost.
    sources:
      - path: Tests
      - path: Sources/Core
      - path: Sources/Widgets/WidgetCatalog.swift
      - path: Sources/DockPanel/DockLayout.swift
      - path: Sources/Services/PollGate.swift
      - path: Sources/DockPanel/ScrollRelay.swift
      - path: Sources/DockPanel/MissionControlGesture.swift
      - path: Sources/Services/PagePreview.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.docket-zh.app.tests
        GENERATE_INFOPLIST_FILE: YES
